# Install, test and build the whole workspace on a normal Linux runner.
# Node 22: the Academy tests import a TypeScript file, which Node strips natively from 22.18.
# The hub was first assembled on a host that could not run `vite build` or a root `npm install`; this workflow is where those are verified.
# Each step runs even if an earlier one failed, so one run shows everything that is broken.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install from the committed lockfile (creates the @assured/* workspace links)
        run: npm ci --no-audit --no-fund
      - name: Test @assured/provenance
        if: always()
        run: npm test -w @assured/provenance
      - name: Test Bench workflow
        if: always()
        run: npm run test:studio
      - name: Test @assured/spec
        if: always()
        run: npm test -w @assured/spec
      - name: Test @assured/rules
        if: always()
        run: npm test -w @assured/rules
      - name: Test Assured QC
        if: always()
        run: npm test -w assured-qc
      - name: Test Assured CRISPR Design
        if: always()
        run: npm test -w assured-crispr-designer
      - name: Test Academy core
        if: always()
        run: npm test -w assured-academy-core
      - name: Academy UI render smoke test (every stage x every preset, no crash, no stale strings)
        if: always()
        run: npm run test:ui

      - name: Contract tests (Design export validates with the shared validator)
        if: always()
        run: npm run test:contract
      - name: Build Assured QC
        if: always()
        run: npm run build -w assured-qc
      - name: Build Assured CRISPR Design
        if: always()
        run: npm run build -w assured-crispr-designer
      - name: Build Academy UI (tsc and vite build)
        if: always()
        run: npm run build:ui

  vercel-config:
    name: Vercel commands (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [apps/qc, apps/design, apps/academy-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # clean checkout, no prior install: exactly what a Vercel build with Root Directory = ${{ matrix.root }} would run
      - name: Run the project's vercel.json install and build commands
        run: node scripts/simulate-vercel.mjs ${{ matrix.root }}
